name: Release & Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Deploy site to GitHub Pages'
        type: boolean
        default: true
      publish_release:
        description: 'Run semantic-release (version bump + GitHub Release + tarballs)'
        type: boolean
        default: true
      force_major:
        description: 'Force major bumps for packages with releasable changes'
        type: boolean
        default: false

permissions:
  contents: read

# Only allow one release at a time
concurrency:
  group: 'release'
  cancel-in-progress: false

jobs:
  build:
    name: Verify release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run allowlisted install scripts
        run: node scripts/run-install-allowlist.mjs

      # `npm run build` builds every workspace package *including the
      # site*, so a broken consumer like `squisq-site` fails this step
      # before semantic-release can publish a broken npm version.
      - name: Build packages
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Published-package contract tests
        run: npm run test:published

      - name: CLI tests
        run: npm run test:cli

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Required native MP4/GIF tests
        run: npm run test:cli:native:required

      - name: Browser end-to-end tests
        run: npm run test:e2e:ci

      - name: Upload verified package builds
        if: inputs.publish_release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-build
          path: packages/*/dist
          retention-days: 1

      # ── Pages ────────────────────────────────────────────────────
      # The site `dist/` was already produced by the earlier
      # `npm run build`; we just upload it here when the run is
      # deploying Pages.
      - name: Upload pages artifact
        if: inputs.deploy_pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: packages/site/dist

  release:
    name: Publish packages
    runs-on: ubuntu-latest
    needs: build
    if: inputs.publish_release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run allowlisted install scripts
        run: node scripts/run-install-allowlist.mjs

      - name: Download verified package builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-build
          path: packages

      # Tags are recorded first so the metadata commit below can name exactly
      # the packages this run released.
      - name: Record tags before release
        run: git tag --list | sort > "$RUNNER_TEMP/tags-before.txt"

      # The npm plugin creates each tarball after applying that package's next
      # version; the GitHub plugin attaches it to the corresponding release.
      - name: Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_RELEASE_FORCE_MAJOR: ${{ inputs.force_major }}
        run: |
          args=(--ignore-packages=packages/site --sequential-prepare)
          if [[ "$SEMANTIC_RELEASE_FORCE_MAJOR" == "true" ]]; then
            args+=(--deps.release=inherit)
          fi
          npx multi-semantic-release "${args[@]}"

      # `@semantic-release/git` is deliberately absent from .releaserc.cjs, so
      # nothing above pushes to `main`. It used to commit and push once per
      # released package, and GitHub intermittently applied one of those ref
      # updates while still reporting it rejected, which aborted the run
      # mid-publish and stranded tagged-but-unpublished packages.
      #
      # Everything the release wrote is committed and pushed here instead, in
      # one commit, after every package has published. This runs even when the
      # release step failed, so the repository still records whatever did
      # publish; the job's own conclusion is unchanged.
      - name: Commit release metadata
        if: ${{ !cancelled() }}
        env:
          GIT_AUTHOR_NAME: semantic-release-bot
          GIT_AUTHOR_EMAIL: semantic-release-bot@martynus.net
          GIT_COMMITTER_NAME: semantic-release-bot
          GIT_COMMITTER_EMAIL: semantic-release-bot@martynus.net
        run: |
          set -euo pipefail

          # `:(glob)` stops `*` from crossing a `/`, so this cannot reach into
          # a package's node_modules.
          git add -- ':(glob)packages/*/package.json' ':(glob)packages/*/CHANGELOG.md'

          if git diff --cached --quiet; then
            echo "No version or changelog changes to commit."
            exit 0
          fi

          git tag --list | sort > "$RUNNER_TEMP/tags-after.txt"
          released=$(comm -13 "$RUNNER_TEMP/tags-before.txt" "$RUNNER_TEMP/tags-after.txt")

          {
            echo "chore(release): publish [skip ci]"
            echo
            if [ -n "$released" ]; then
              printf '%s\n' "$released" | sed 's/^/- /'
            else
              echo "- no packages were tagged in this run"
            fi
          } > "$RUNNER_TEMP/release-commit-msg.txt"

          git commit --file "$RUNNER_TEMP/release-commit-msg.txt"
          git --no-pager show --stat --oneline HEAD

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed release metadata."
              exit 0
            fi

            # A rejected push that nonetheless landed is the exact failure this
            # step exists to survive, so check for it before retrying.
            git fetch --quiet origin main
            if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
              echo "Remote main already points at this commit; the rejected push had in fact been applied."
              exit 0
            fi

            echo "Push attempt ${attempt} did not land; retrying."
            sleep $((attempt * 10))
          done

          echo "::error::Could not push the release metadata commit. Packages are published and tagged; push $(git rev-parse HEAD) to main to record the version bumps."
          exit 1

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: build
    if: inputs.deploy_pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
