name: Release & Deploy

on:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'Deploy site to GitHub Pages'
        type: boolean
        default: true
      publish_release:
        description: 'Run semantic-release (version bump + GitHub Release + tarballs)'
        type: boolean
        default: true
      force_major:
        description: 'Force major bumps for packages with releasable changes'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write
  pull-requests: write

# Only allow one release at a time
concurrency:
  group: 'release'
  cancel-in-progress: false

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run allowlisted install scripts
        run: node scripts/run-install-allowlist.mjs

      # `npm run build` builds every workspace package *including the
      # site*, so a broken consumer like `squisq-site` fails this step
      # before semantic-release can publish a broken npm version.
      - name: Build packages
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Published-package contract tests
        run: npm run test:published

      - name: CLI tests
        run: npm run test:cli

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Assert native video capabilities
        run: node scripts/assert-native-video-tools.mjs

      - name: Required native MP4/GIF tests
        env:
          SQUISQ_REQUIRE_NATIVE_E2E: '1'
        run: npm run test:cli:native

      - name: Browser end-to-end tests
        run: npm run test:e2e:built

      # ── Release ──────────────────────────────────────────────────
      # The npm plugin creates each tarball after applying that package's next
      # version; the GitHub plugin attaches it to the corresponding release.
      - name: Semantic Release
        if: inputs.publish_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SEMANTIC_RELEASE_FORCE_MAJOR: ${{ inputs.force_major }}
        run: |
          args=(--ignore-packages=packages/site --sequential-prepare)
          if [[ "$SEMANTIC_RELEASE_FORCE_MAJOR" == "true" ]]; then
            args+=(--deps.release=inherit)
          fi
          npx multi-semantic-release "${args[@]}"

      # ── Pages ────────────────────────────────────────────────────
      # The site `dist/` was already produced by the earlier
      # `npm run build`; we just upload it here when the run is
      # deploying Pages.
      - name: Upload pages artifact
        if: inputs.deploy_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: packages/site/dist

  deploy-pages:
    name: Deploy Pages
    runs-on: ubuntu-latest
    needs: build
    if: inputs.deploy_pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
