name: Extended validation

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Validation tier
        type: choice
        options: [all, mutation, corpus]
        default: all

permissions:
  contents: read

jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: node scripts/run-install-allowlist.mjs
      - run: npm run build
      - name: Mutation tests
        if: inputs.tier == 'all' || inputs.tier == 'mutation'
        run: npm run test:mutation
      - name: Fetch verified corpus files
        if: inputs.tier == 'all' || inputs.tier == 'corpus'
        run: node scripts/corpus-fetch.mjs
      - name: Corpus oracle tests
        if: inputs.tier == 'all' || inputs.tier == 'corpus'
        env:
          SQUISQ_CORPUS: required
        run: npm run test:corpus
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: extended-validation
          path: |
            reports/mutation/
            .corpus/report/
          include-hidden-files: true
          retention-days: 14
